<script>
        let songsData = {};
        let currentLyrics = [];
        let currentSongKey = '';
        let userRole = "{{ role }}";
        
        // Visualizer variables
        let audioCtx, analyser, dataArray, source, canvasCtx, visualizerId;

        fetch('/api/songs')
            .then(res => res.json())
            .then(data => {
                songsData = data;
                let listHtml = '';
                for(let key in songsData) {
                    let song = songsData[key];
                    let lockMark = (song.is_premium && userRole === 'normal') ? '🔒 (VIP)' : '🎵';
                    listHtml += `<span class="song-item" onclick="playSong('${key}')">${lockMark} ${song.display_name}</span>`;
                }
                document.getElementById('tracks-list').innerHTML = listHtml;
            });

        function toggleProfileMenu() {
            let menu = document.getElementById('profile-dropdown');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        window.onclick = function(event) {
            if (!event.target.closest('.profile-container') && !event.target.closest('.profile-dropdown')) {
                let menu = document.getElementById('profile-dropdown');
                if(menu) menu.style.display = 'none';
            }
        }

        function openAuthModal(type) {
            document.getElementById('auth-modal').style.display = 'flex';
            document.getElementById('auth-title').innerText = type === 'register' ? 'REGISTER TO PLP' : 'LOGIN TO PLP';
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').style.display = 'none';
        }

        function submitAuth() {
            const email = document.getElementById('auth-email').value.trim();
            if(!email) return alert("Please enter an email!");
            
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    location.reload();
                } else {
                    alert("Authentication failed!");
                }
            });
        }

        function logoutUser() {
            fetch('/api/logout', { method: 'POST' })
            .then(() => location.reload());
        }

        function openSettings() {
            document.getElementById('profile-dropdown').style.display = 'none';
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function initVisualizer() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return;
            }
            try {
                const audioEle = document.getElementById('audio-player');
                const canvas = document.getElementById('visualizer');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                canvasCtx = canvas.getContext('2d');
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audioEle);
                
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                analyser.fftSize = 64;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                drawVisualizer();
            } catch (e) {
                console.log("Visualizer error: ", e);
            }
        }

        function drawVisualizer() {
            visualizerId = requestAnimationFrame(drawVisualizer);
            if (!analyser) return;
            
            analyser.getByteFrequencyData(dataArray);
            
            const canvas = document.getElementById('visualizer');
            canvasCtx.fillStyle = 'rgba(3, 7, 5, 0.8)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            
            let barWidth = (canvas.width / dataArray.length) * 1.8;
            let barHeight;
            let x = 0;
            
            for (let i = 0; i < dataArray.length; i++) {
                barHeight = (dataArray[i] / 255) * canvas.height;
                
                canvasCtx.fillStyle = '#00ff80';
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                
                x += barWidth + 3;
            }
        }

        function playSong(key) {
            let song = songsData[key];
            if(!song) return alert("Song not found!");

            if(song.is_premium && userRole === 'normal') {
                alert("🔒 यह प्रीमियम गाना है! इसे सुनने के लिए VIP एक्सेस या Owner लॉगिन की आवश्यकता है।");
                return;
            }

            currentSongKey = key;
            openFullPlayer();

            document.getElementById('song-title').innerText = song.display_name + " - " + song.artist;
            document.getElementById('mini-song-name').innerText = song.display_name;
            document.getElementById('mini-artist-name').innerText = song.artist;
            
            let officialBtn = document.getElementById('official-link');
            if(song.official_url) {
                officialBtn.href = song.official_url;
                officialBtn.style.display = 'inline-block';
            } else {
                officialBtn.style.display = 'none';
            }

            let audio = document.getElementById('audio-player');
            let video = document.getElementById('video-player');
            
            audio.src = song.audio_url;
            video.src = song.video_url;
            
            currentLyrics = song.lyrics_timed;
            renderLyrics();

            audio.play().then(() => {
                initVisualizer();
            }).catch(() => {});
            
            audio.ontimeupdate = () => syncLyrics(audio.currentTime);
        }

        function renderLyrics() {
            let container = document.getElementById('lyrics-content');
            container.innerHTML = '';
            currentLyrics.forEach((line) => {
                const lyric = document.createElement('div');
                lyric.className = 'lyric-line';
                lyric.textContent = line.text;
                lyric.onclick = () => { document.getElementById('audio-player').currentTime = line.time; };
                container.appendChild(lyric);
            });
        }

        function syncLyrics(currentTime) {
            const lines = document.querySelectorAll('.lyric-line');
            let activeIndex = -1;
            currentLyrics.forEach((line, index) => {
                if (Number(line.time) <= currentTime) activeIndex = index;
            });
            lines.forEach((line, index) => {
                line.classList.toggle('active', index === activeIndex);
            });
            if (activeIndex >= 0 && lines[activeIndex]) {
                lines[activeIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function togglePlayPause() {
            let audio = document.getElementById('audio-player');
            if (audio.paused) {
                audio.play();
                if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } else {
                audio.pause();
            }
        }

        function searchSong() {
            let query = document.getElementById('search-input').value.trim().toLowerCase();
            for(let key in songsData) {
                if(songsData[key].display_name.toLowerCase().includes(query)) {
                    playSong(key);
                    return;
                }
            }
            alert("यह गाना उपलब्ध नहीं है!");
        }

        function goBack() {
            document.getElementById('screen-player').style.display = 'none';
            document.getElementById('screen-main').style.display = 'block';
            let audio = document.getElementById('audio-player');
            if (currentSongKey && audio.src) {
                document.getElementById('mini-player').style.display = 'flex';
            }
        }

        function openFullPlayer() {
            if(!currentSongKey) return;
            document.getElementById('screen-main').style.display = 'none';
            document.getElementById('screen-player').style.display = 'block';
            document.getElementById('mini-player').style.display = 'none';
            setTimeout(() => {
                let canvas = document.getElementById('visualizer');
                if(canvas) {
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                }
            }, 200);
        }
    </script>
