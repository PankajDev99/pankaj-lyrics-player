<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLP - Pankaj Lyrics Player</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#00ff80">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #030705;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 255, 128, 0.12) 0%, rgba(3, 7, 5, 0.95) 70%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(5, 12, 8, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 255, 128, 0.3);
            padding: 12px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #00ff80;
            text-shadow: 0 0 12px rgba(0, 255, 128, 0.8);
            white-space: nowrap;
        }

        .search-box {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 400px;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px 18px;
            background: rgba(12, 22, 17, 0.9);
            border: 1px solid rgba(0, 255, 128, 0.3);
            border-radius: 30px;
            color: #00ff80;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="email"]:focus {
            border-color: #00ff80;
            box-shadow: 0 0 12px rgba(0, 255, 128, 0.4);
        }

        .neon-btn {
            background: linear-gradient(135deg, #00ff80 0%, #00b359 100%);
            color: #030705;
            border: none;
            border-radius: 30px;
            padding: 10px 20px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 128, 0.4);
            white-space: nowrap;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .neon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 128, 0.8);
        }

        .apk-btn {
            background: linear-gradient(135deg, #00e5ff 0%, #0088cc 100%);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .vip-badge {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #030705;
            padding: 8px 16px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-email {
            font-size: 12px;
            color: #00ff80;
            font-weight: 600;
        }

        .container { max-width: 1000px; margin: 25px auto 0 auto; padding: 0 15px; }

        .glass-card {
            background: rgba(7, 14, 10, 0.85);
            border: 1px solid rgba(0, 255, 128, 0.25);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
        }

        .song-item {
            display: inline-block;
            background: rgba(0, 255, 128, 0.08);
            border: 1px solid rgba(0, 255, 128, 0.4);
            color: #00ff80;
            padding: 8px 18px;
            border-radius: 20px;
            margin: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .song-item:hover {
            background: #00ff80;
            color: #030705;
            box-shadow: 0 0 15px rgba(0, 255, 128, 0.6);
        }

        .player-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .player-grid { grid-template-columns: 1fr; }
            .header-content { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; max-width: none; }
        }

        video {
            width: 100%;
            border-radius: 18px;
            border: 1px solid rgba(0, 255, 128, 0.3);
        }

        audio {
            width: 100%;
            margin-bottom: 10px;
            filter: invert(100%) hue-rotate(90deg);
        }

        #visualizer {
            width: 100%;
            height: 50px;
            background: rgba(3, 7, 5, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 128, 0.2);
            margin-bottom: 15px;
        }

        #lyrics-box {
            background: rgba(4, 9, 6, 0.95);
            border: 1px solid rgba(0, 255, 128, 0.4);
            border-radius: 18px;
            height: 250px;
            overflow-y: auto;
            text-align: center;
            padding: 20px;
            scroll-behavior: smooth;
        }

        /* Edit-style Animation for Lyrics */
        @keyframes editSlideIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .lyric-line {
            font-size: 16px;
            font-weight: 700;
            color: #1e3828;
            margin: 16px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: editSlideIn 0.4s ease forwards;
        }

        .lyric-line:hover {
            color: #00b359;
            transform: scale(1.05);
        }

        .style-dhundle .lyric-line.active {
            color: #00ff80;
            transform: scale(1.22);
            text-shadow: 0 0 20px #00ff80;
        }

        .style-rose .lyric-line.active {
            color: #ff4d94;
            transform: translateY(-5px) scale(1.15);
            text-shadow: 0 0 15px #ff4d94;
        }

        .style-kitab .lyric-line.active {
            color: #ffd700;
            transform: scale(1.18) rotate(-1deg);
            text-shadow: 0 0 15px #ffd700;
        }

        .mini-player {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 950px;
            background: rgba(6, 15, 10, 0.92);
            border: 1px solid rgba(0, 255, 128, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 50px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 25px rgba(0, 255, 128, 0.25);
            z-index: 2000;
            cursor: pointer;
        }

        .mini-info { display: flex; align-items: center; gap: 12px; }
        .mini-icon { font-size: 20px; animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .mini-title { color: #00ff80; font-size: 13px; font-weight: 700; font-family: 'Orbitron', sans-serif; }
        .mini-sub { color: rgba(255, 255, 255, 0.6); font-size: 11px; }
        .mini-btn {
            background: #00ff80; color: #030705; border: none; width: 36px; height: 36px;
            border-radius: 50%; font-weight: bold; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="header-content">
            <div class="nav-brand">👁️ PLP PLAYER</div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search track name...">
                <button class="neon-btn" onclick="searchSong()">SEARCH</button>
            </div>
            
            <div class="user-section">
                <a id="apk-download-btn" href="/static/PankajLyricsPlayer.apk" download class="neon-btn apk-btn" style="padding:6px 12px; font-size:10px;">
                    📲 DOWNLOAD APK
                </a>
                
                {% if user %}
                    <div class="vip-badge">⭐ Owner / VIP</div>
                    <span class="user-email">👤 {{ user }}</span>
                    <button class="neon-btn" onclick="logoutUser()" style="padding:6px 12px; font-size:10px; background:linear-gradient(135deg, #ff4d4d 0%, #cc0000 100%); color:#fff;">LOGOUT</button>
                {% else %}
                    <button class="neon-btn" onclick="openLoginModal()" style="padding:6px 14px; font-size:10px;">LOGIN</button>
                {% endif %}
                
                <button id="install-btn" class="neon-btn" style="display:none; padding:6px 12px; font-size:10px;">INSTALL</button>
            </div>
        </div>
    </div>

    <!-- Login Modal / Prompt -->
    <div id="login-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:3000; justify-content:center; align-items:center;">
        <div class="glass-card" style="width:90%; max-width:400px; text-align:center;">
            <h3 style="color:#00ff80; font-family:'Orbitron'; margin-bottom:15px;">LOGIN TO PLP</h3>
            <input type="email" id="login-email" placeholder="Enter your email (e.g. pankaj@gmail.com)" style="margin-bottom:15px;">
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="neon-btn" onclick="submitLogin()">SUBMIT</button>
                <button class="neon-btn" onclick="closeLoginModal()" style="background:rgba(255,255,255,0.1); color:#fff;">CANCEL</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="screen-main">
            <div class="glass-card">
                <h3 style="color:#00ff80; font-family:'Orbitron'; text-align:center; font-size:16px; margin-bottom:15px; letter-spacing:1px;">⚡ TRACK LIBRARY</h3>
                <div id="tracks-list" style="text-align:center;"></div>
            </div>
        </div>

        <div id="screen-player" style="display:none;">
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                    <button class="neon-btn" onclick="goBack()" style="padding:6px 16px;">⬅ BACK</button>
                    <h3 id="song-title" style="color:#00ff80; font-family:'Orbitron'; font-size:16px;"></h3>
                    <a id="official-link" href="#" target="_blank" class="neon-btn" style="text-decoration:none; padding:6px 14px; background:linear-gradient(135deg, #ff0055 0%, #b3003b 100%); color:#fff; font-size:10px; display:none;">
                        ▶ OFFICIAL SONG
                    </a>
                </div>

                <div class="player-grid">
                    <div>
                        <video id="video-player" autoplay loop muted></video>
                    </div>
                    <div>
                        <audio id="audio-player" controls autoplay crossorigin="anonymous"></audio>
                        <canvas id="visualizer"></canvas>
                        <div id="lyrics-box" class="style-dhundle">
                            <div id="lyrics-content"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="mini-player" class="mini-player" style="display: none;" onclick="openFullPlayer()">
        <div class="mini-info">
            <div class="mini-icon">💿</div>
            <div>
                <div id="mini-song-name" class="mini-title">Song Name</div>
                <div id="mini-artist-name" class="mini-sub">Playing Now • Tap for Lyrics</div>
            </div>
        </div>
        <div onclick="event.stopPropagation();">
            <button id="mini-play-btn" class="mini-btn" onclick="togglePlayPause()">⏸</button>
        </div>
    </div>

    <script>
        let songsData = {};
        let currentLyrics = [];
        let currentSongKey = '';
        let audioCtx, analyser, source, canvas, ctx;

        fetch('/api/songs')
            .then(res => res.json())
            .then(data => {
                songsData = data;
                let listHtml = '';
                for(let key in songsData) {
                    listHtml += `<span class="song-item" onclick="playSong('${key}')">🎵 ${songsData[key].display_name}</span>`;
                }
                document.getElementById('tracks-list').innerHTML = listHtml;
            });

        function openLoginModal() {
            document.getElementById('login-modal').style.display = 'flex';
        }

        function closeLoginModal() {
            document.getElementById('login-modal').style.display = 'none';
        }

        function submitLogin() {
            const email = document.getElementById('login-email').value.trim();
            if(!email) return alert("Please enter a valid email!");
            
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    location.reload();
                } else {
                    alert("Login failed!");
                }
            });
        }

        function logoutUser() {
            fetch('/api/logout', { method: 'POST' })
            .then(() => location.reload());
        }

        function initAudioVisualizer() {
            if (audioCtx) return;
            const audio = document.getElementById('audio-player');
            canvas = document.getElementById('visualizer');
            ctx = canvas.getContext('2d');
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 64;

            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) * 2;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                ctx.fillStyle = '#00ff80';
                ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
                x += barWidth;
            }
        }

        function playSong(key) {
            let song = songsData[key];
            if(!song) return alert("Song not found!");

            currentSongKey = key;
            openFullPlayer();

            document.getElementById('song-title').innerText = song.display_name + " - " + song.artist;
            document.getElementById('mini-song-name').innerText = song.display_name;
            document.getElementById('mini-artist-name').innerText = song.artist;
            
            let officialBtn = document.getElementById('official-link');
            if(song.official_url) {
                officialBtn.href = song.official_url;
                officialBtn.style.display = 'inline-block';
            } else {
                officialBtn.style.display = 'none';
            }

            let audio = document.getElementById('audio-player');
            let video = document.getElementById('video-player');
            let lyricsBox = document.getElementById('lyrics-box');
            
            audio.src = song.audio_url;
            video.src = song.video_url;
            
            lyricsBox.className = ''; 
            if(key.includes('rose')) lyricsBox.classList.add('style-rose');
            else if(key.includes('kitab')) lyricsBox.classList.add('style-kitab');
            else lyricsBox.classList.add('style-dhundle');

            currentLyrics = song.lyrics_timed;
            renderLyrics();

            audio.play().then(() => {
                initAudioVisualizer();
                if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }).catch(() => {});

            document.getElementById('mini-play-btn').innerText = '⏸';

            audio.ontimeupdate = () => syncLyrics(audio.currentTime);
            audio.onpause = () => { document.getElementById('mini-play-btn').innerText = '▶'; };
            audio.onplay = () => { document.getElementById('mini-play-btn').innerText = '⏸'; };
        }

        function seekToLyric(time) {
            let audio = document.getElementById('audio-player');
            audio.currentTime = Number(time);
            audio.play();
        }

        function renderLyrics() {
            let container = document.getElementById('lyrics-content');
            container.innerHTML = '';

            currentLyrics.forEach((line, index) => {
                const lyric = document.createElement('div');
                lyric.className = 'lyric-line';
                lyric.dataset.index = index;
                lyric.textContent = line.text || line.lyric || line;
                lyric.onclick = () => seekToLyric(line.time);
                container.appendChild(lyric);
            });
        }

        function syncLyrics(currentTime) {
            const lines = document.querySelectorAll('.lyric-line');
            let activeIndex = -1;

            currentLyrics.forEach((line, index) => {
                if (Number(line.time) <= currentTime) activeIndex = index;
            });

            lines.forEach((line, index) => {
                line.classList.toggle('active', index === activeIndex);
            });

            if (activeIndex >= 0 && lines[activeIndex]) {
                lines[activeIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function togglePlayPause() {
            let audio = document.getElementById('audio-player');
            if (audio.paused) audio.play();
            else audio.pause();
        }

        function searchSong() {
            let query = document.getElementById('search-input').value.trim().toLowerCase();
            if(songsData[query]) {
                playSong(query);
            } else {
                for(let key in songsData) {
                    if(songsData[key].display_name.toLowerCase().includes(query)) {
                        playSong(key);
                        return;
                    }
                }
                alert("यह गाना उपलब्ध नहीं है!");
            }
        }

        function goBack() {
            document.getElementById('screen-player').style.display = 'none';
            document.getElementById('screen-main').style.display = 'block';
            let audio = document.getElementById('audio-player');
            if (currentSongKey && audio.src) {
                document.getElementById('mini-player').style.display = 'flex';
            }
        }

        function openFullPlayer() {
            if(!currentSongKey) return;
            document.getElementById('screen-main').style.display = 'none';
            document.getElementById('screen-player').style.display = 'block';
            document.getElementById('mini-player').style.display = 'none';
        }

        function checkAppDisplayMode() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const apkBtn = document.getElementById('apk-download-btn');
            if (isStandalone && apkBtn) {
                apkBtn.style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', checkAppDisplayMode);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
